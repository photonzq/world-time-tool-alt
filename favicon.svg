<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wtbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#091e42" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#wtbGrad)"/>
  
  <!-- Subtle Globe Meridians and Parallels -->
  <ellipse cx="32" cy="32" rx="27" ry="11" fill="none" stroke="#60a5fa" stroke-width="1.6" opacity="0.45"/>
  <ellipse cx="32" cy="32" rx="12" ry="27" fill="none" stroke="#60a5fa" stroke-width="1.6" opacity="0.45"/>
  <line x1="32" y1="5" x2="32" y2="59" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.4"/>

  <!-- Dial Border -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.35"/>

  <!-- Major Hour Ticks (12, 3, 6, 9) -->
  <line x1="32" y1="6" x2="32" y2="11" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="58" y1="32" x2="53" y2="32" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="32" y1="58" x2="32" y2="53" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="11" y2="32" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Clock Hands (10:10 Classic Time Position) -->
  <!-- Hour hand pointing towards 10 o'clock -->
  <line x1="32" y1="32" x2="20" y2="23" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" filter="url(#handShadow)"/>
  <!-- Minute hand pointing towards 2 o'clock -->
  <line x1="32" y1="32" x2="45" y2="19" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" filter="url(#handShadow)"/>

  <!-- Amber/Gold Second Hand pointing down to 6 -->
  <line x1="32" y1="32" x2="32" y2="48" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="32" cy="48" r="1.4" fill="#fbbf24"/>

  <!-- Center Pivot Cap -->
  <circle cx="32" cy="32" r="3.4" fill="#0f172a"/>
  <circle cx="32" cy="32" r="1.8" fill="#fbbf24"/>
</svg>
